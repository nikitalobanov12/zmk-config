# ZMK Configuration for Lily58 with nice!nano

# Enable deep sleep to save battery
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth settings
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Display battery level in HID
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable OLED display (if you have one)
CONFIG_ZMK_DISPLAY=y

# Disable USB when not connected (save battery)
CONFIG_ZMK_USB=n

# Debounce settings for nice!nano
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Enable experimental features
CONFIG_ZMK_STUDIO=y
